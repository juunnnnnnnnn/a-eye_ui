<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <title>A-EYE — AI 이미지 판별기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="colors_and_type.css"/>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(6, 182, 212, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(91, 107, 255, 0.16), transparent 34%),
        linear-gradient(180deg, #edf2ff 0%, #f8fafc 38%, #eef2f7 100%);
      font-family: var(--font-sans);
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      min-height: 100vh;
      padding: 32px 24px 48px;
    }

    .app-header {
      max-width: 1200px;
      margin: 0 auto 28px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .app-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.32);
      box-shadow: 0 18px 36px -24px rgba(15, 23, 42, 0.28);
      color: #475569;
      font: 700 12px/1 var(--font-sans);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .app-title {
      margin: 16px 0 10px;
      font: 800 clamp(34px, 5vw, 58px)/1.02 var(--font-sans);
      letter-spacing: -0.05em;
      color: #0f172a;
    }

    .app-title span {
      background: linear-gradient(135deg, #06b6d4, #5b6bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .app-sub {
      max-width: 760px;
      margin: 0;
      color: #475569;
      font: 500 17px/1.65 var(--font-sans);
    }

    .app-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .header-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.32);
      color: #0f172a;
      text-decoration: none;
      font: 600 14px/1 var(--font-sans);
      box-shadow: 0 18px 36px -26px rgba(15, 23, 42, 0.26);
    }

    .app-main {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
    }

    .device-stage {
      display: flex;
      justify-content: center;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-card {
      padding: 20px 20px 18px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow:
        0 24px 48px -28px rgba(15, 23, 42, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(24px);
    }

    .panel-card h2 {
      margin: 0 0 10px;
      font: 700 18px/1.2 var(--font-sans);
      letter-spacing: -0.03em;
      color: #0f172a;
    }

    .panel-card p {
      margin: 0;
      color: #475569;
      font: 500 14px/1.6 var(--font-sans);
    }

    .panel-list {
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .panel-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: #334155;
      font: 600 13px/1.45 var(--font-sans);
    }

    .panel-list li span {
      margin-top: 2px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, #06b6d4, #5b6bff);
      box-shadow: 0 0 12px rgba(91, 107, 255, 0.4);
      flex-shrink: 0;
    }

    .panel-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 4px;
      color: #64748b;
      font: 600 12px/1.4 var(--font-mono);
    }

    .phone {
      width: 390px;
      height: 844px;
      border-radius: 42px;
      background: #161923;
      padding: 7px;
      box-shadow:
        0 36px 72px -24px rgba(15, 23, 42, 0.42),
        0 14px 28px -18px rgba(15, 23, 42, 0.4),
        inset 0 0 0 1.5px rgba(255,255,255,0.08),
        inset 0 0 0 2.5px rgba(0,0,0,0.68);
      position: relative;
      flex-shrink: 0;
    }

    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 36px;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
    }

    .notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 26px;
      background: #000;
      border-radius: 999px;
      z-index: 50;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 22px 4px;
      height: 38px;
      font: 600 13px/1 var(--font-sans);
      letter-spacing: -0.01em;
      color: var(--fg);
      position: relative;
      z-index: 5;
    }

    .status-bar .icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 112px;
      height: 4px;
      background: var(--fg);
      opacity: 0.58;
      border-radius: 3px;
      z-index: 60;
    }

    .screen-body {
      height: calc(100% - 38px);
      overflow: hidden;
      position: relative;
    }

    .noise-bg {
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.05) 0, transparent 1px),
        radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.04) 0, transparent 1px),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.04) 0, transparent 1px);
      background-size: 80px 80px, 120px 120px, 160px 160px;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.55;
      pointer-events: none;
    }

    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(100%); }
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 90px;
      background: linear-gradient(180deg,
        transparent,
        rgba(6,182,212, 0.0) 0%,
        rgba(6,182,212, 0.46) 70%,
        rgba(91, 107, 255, 0.84) 100%);
      box-shadow: 0 0 24px rgba(6,182,212,0.56);
      animation: scan 2.4s ease-in-out infinite alternate;
    }

    .theme-dark .scan-line {
      background: linear-gradient(180deg,
        transparent,
        rgba(34,211,238, 0.0) 0%,
        rgba(34,211,238, 0.52) 70%,
        rgba(167, 139, 250, 0.9) 100%);
      box-shadow: 0 0 24px rgba(34,211,238,0.7);
    }

    @media (max-width: 980px) {
      .app-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .app-actions {
        justify-content: flex-start;
      }

      .app-main {
        display: flex;
      }

      .side-panel {
        order: -1;
      }
    }

    @media (max-width: 520px) {
      .app-shell {
        padding: 20px 14px 28px;
      }

      .phone {
        width: min(390px, calc(100vw - 28px));
        height: calc(min(390px, calc(100vw - 28px)) * 2.1641025641);
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <div class="app-kicker">
          <img src="assets/logo.svg" alt="a-eye" width="18" height="18"/>
          AI Image Detector
        </div>
        <h1 class="app-title">A-EYE <span>AI 이미지 판별기</span></h1>
        <p class="app-sub">
          이미지의 생성 가능성과 의심 영역을 한 화면에서 확인합니다.
        </p>
      </div>
      <div class="app-actions">
        <a class="header-link" href="./a-eye Mockup.html">원본 목업 보기</a>
      </div>
    </header>

    <main class="app-main">
      <section class="device-stage">
        <div id="app-root"></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="ui_kits/a-eye-app/Icons.jsx"></script>
  <script type="text/babel" src="ui_kits/a-eye-app/Phone.jsx"></script>
  <script type="text/babel" src="ui_kits/a-eye-app/Screens.jsx"></script>
  <script type="text/babel" src="ui_kits/a-eye-app/InteractiveApp.jsx"></script>
</body>
</html>
