<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>a-eye — Design Mockup v1</title>
<meta name="viewport" content="width=1600"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
  body {
    background: #E5E7EB;
    font-family: var(--font-sans);
    color: #0F172A;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Page chrome ---- */
  .page-title {
    font: 800 56px/1.05 var(--font-sans);
    letter-spacing: -0.04em;
  }
  .page-sub { color: #475569; }

  /* ---- Phone frame (Galaxy S24 — 390 × 844, punch-hole, thin bezels) ---- */
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 42px;
    background: #1A1A1F;
    padding: 7px;
    box-shadow:
      0 30px 60px -20px rgba(15, 23, 42, 0.35),
      0 8px 16px -8px rgba(15, 23, 42, 0.25),
      inset 0 0 0 1.5px rgba(255,255,255,0.08),
      inset 0 0 0 2.5px rgba(0,0,0,0.6);
    position: relative;
    flex-shrink: 0;
  }
  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 36px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
  }

  /* Punch-hole camera (centered, small) */
  .notch {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 11px; height: 11px;
    background: #000;
    border-radius: 999px;
    z-index: 50;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }

  /* Android status bar */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 22px 4px;
    height: 38px;
    font: 600 13px/1 var(--font-sans);
    letter-spacing: -0.01em;
    color: var(--fg);
    position: relative;
    z-index: 5;
  }
  .status-bar .icons {
    display: flex; align-items: center; gap: 5px;
  }

  /* Android nav pill (gesture bar) */
  .home-indicator {
    position: absolute;
    bottom: 7px; left: 50%;
    transform: translateX(-50%);
    width: 108px; height: 4px;
    background: var(--fg);
    opacity: 0.6;
    border-radius: 3px;
    z-index: 60;
  }

  /* Screen content area (after status bar) */
  .screen-body {
    height: calc(100% - 38px);
    overflow: hidden;
    padding: 0;
    position: relative;
  }

  /* Mockup label */
  .mock-label {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px;
    font: 600 13px/1 var(--font-sans);
    letter-spacing: 0.02em;
    color: #334155;
  }
  .mock-label .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px;
    border-radius: 6px;
    background: #fff;
    border: 1px solid #CBD5E1;
    font: 600 11px/1 var(--font-mono);
    color: #475569;
  }
  .mock-label .mode-pill {
    margin-left: auto;
    font: 500 11px/1 var(--font-mono);
    padding: 4px 8px;
    border-radius: 999px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .mode-pill.light { background: #fff; color: #475569; border: 1px solid #CBD5E1; }
  .mode-pill.dark  { background: #0F172A; color: #94A3B8; border: 1px solid #334155; }

  /* Grid */
  .mock-grid {
    display: grid;
    grid-template-columns: repeat(4, max-content);
    gap: 56px 40px;
    justify-content: center;
    padding: 56px 40px 80px;
  }
  @media (max-width: 1500px) { .mock-grid { grid-template-columns: repeat(2, max-content); } }
  @media (max-width: 820px)  { .mock-grid { grid-template-columns: repeat(1, max-content); } }

  /* ---- Reusable inner-screen primitives ---- */
  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.55;
    pointer-events: none;
  }

  /* Scan line for analyzing */
  @keyframes scan {
    0% { transform: translateY(0); }
    100% { transform: translateY(100%); }
  }
  .scan-line {
    position: absolute; left: 0; right: 0; top: 0;
    height: 90px;
    background: linear-gradient(180deg,
      transparent,
      rgba(6,182,212, 0.0) 0%,
      rgba(6,182,212, 0.5) 70%,
      rgba(91, 107, 255, 0.9) 100%);
    box-shadow: 0 0 24px rgba(6,182,212,0.6);
    animation: scan 2.4s ease-in-out infinite alternate;
  }
  .theme-dark .scan-line {
    background: linear-gradient(180deg,
      transparent,
      rgba(34,211,238, 0.0) 0%,
      rgba(34,211,238, 0.5) 70%,
      rgba(167, 139, 250, 0.9) 100%);
    box-shadow: 0 0 24px rgba(34,211,238,0.7);
  }

  /* Subtle grid noise on splash */
  .noise-bg {
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.05) 0, transparent 1px),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.04) 0, transparent 1px),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.04) 0, transparent 1px);
    background-size: 80px 80px, 120px 120px, 160px 160px;
  }
</style>
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header class="text-center pt-16 px-8">
  <div class="inline-flex items-center gap-3 mb-6 px-4 py-2 rounded-full bg-white border border-slate-300/70" style="box-shadow: 0 1px 2px rgba(15,23,42,0.04);">
    <img src="assets/logo.svg" alt="a-eye" width="20" height="20"/>
    <span class="text-[12px] font-semibold tracking-wider text-slate-600 uppercase">A-EYE / AI 이미지 판별기</span>
  </div>
  <h1 class="page-title">A-EYE <span style="color:#94A3B8; font-weight:300;">—</span> <span class="aeye-gradient-text" style="background:linear-gradient(135deg,#06B6D4,#5B6BFF); -webkit-background-clip:text; background-clip:text; color:transparent;">디자인 시안 v1</span></h1>
  <p class="page-sub mt-4 text-[17px] max-w-[680px] mx-auto leading-relaxed">
    한 번의 시선으로, 진짜와 가짜를 가려냅니다.
  </p>
  <p class="page-sub mt-2 text-[13px] tracking-wide uppercase">8개 화면 · 라이트 + 다크 · iPhone 14 Pro 프레임</p>
</header>
